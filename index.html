<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203a34"><link rel="manifest" href="./manifest.webmanifest"><title>旅迹 · Travelogue</title><style>body{margin:0;background:#f6f5f0;color:#203a34;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{background:#203a34;color:white;padding:22px}main{max-width:760px;margin:auto;padding:16px}h1{margin:0;font-size:27px}small{color:#8ca99a}section{background:white;border:1px solid #e0e6dc;border-radius:16px;padding:18px;margin:14px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cfd8ce;border-radius:10px;font:inherit}button{background:#203a34;color:white;border:0;border-radius:10px;padding:11px 15px;margin:4px;cursor:pointer}button.alt{background:#e8eee7;color:#203a34}.tabs{display:flex;flex-wrap:wrap;gap:5px}.entry{padding:14px;border-left:3px solid #9eb7a7;background:#f6f8f5;margin:10px 0;border-radius:8px}.entry img{max-width:100%;max-height:300px;border-radius:9px}.muted{color:#68796e}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.hide{display:none}.chip{display:inline-block;padding:4px 9px;background:#e9eee8;border-radius:20px;font-size:12px}label{font-size:14px;font-weight:600}a{color:#27634d}#map{height:300px;border-radius:12px;background:#e9eee8;display:grid;place-items:center}</style></head><body><header><h1>旅迹 <span style="font-weight:300">Travelogue</span></h1><small>把旅行变成值得重看的故事</small></header><main><section><div class="row"><div><strong id="tripTitle">北京 · 大同</strong><p class="muted" id="tripDates">2026.11.14—11.15</p></div><button onclick="newTrip()">＋ 新旅行</button></div><label>选择旅行</label><select id="tripSelect" onchange="selectTrip(this.value)"></select></section><div class="tabs"><button onclick="tab('timeline')">时间轴</button><button onclick="tab('add')">＋ 记录</button><button onclick="tab('cost')">消费</button><button onclick="tab('map')">地图</button><button onclick="tab('backup')">备份 / 分享</button></div><section id="timeline"><h2>旅途记录</h2><div id="entries"></div></section><section id="add" class="hide"><h2>添加一条旅行记录</h2><form id="recordForm"><label>地点</label><input name="place" required placeholder="例如：大同古城"><label>日期时间</label><input name="time" type="datetime-local" required><label>类型</label><select name="type"><option>景点</option><option>美食</option><option>购物</option><option>交通</option><option>住宿</option><option>避坑</option><option>其他</option></select><label>花费（元）</label><input name="cost" type="number" min="0" step="0.01" value="0"><label>纬度（可选）</label><input name="lat" type="number" step="any" placeholder="40.0768"><label>经度（可选）</label><input name="lng" type="number" step="any" placeholder="113.3001"><label>照片</label><input id="photo" type="file" accept="image/*"><label>感受 / 避坑提示</label><textarea name="note" rows="4" placeholder="真实体验、吃了什么、买了什么……"></textarea><button type="submit">保存记录</button></form></section><section id="cost" class="hide"><h2>旅行账本</h2><div id="stats"></div></section><section id="map" class="hide"><h2>地点地图</h2><div id="mapCanvas"></div><p class="muted">带坐标的记录可打开地图定位；地图需要联网。</p></section><section id="backup" class="hide"><h2>数据与分享</h2><p>数据仅保存在当前浏览器，请经常导出备份。换设备不会自动同步。</p><button onclick="exportData()">导出全部 JSON</button><label>导入 JSON 备份</label><input type="file" id="importFile" accept=".json,application/json" onchange="importData(this.files[0])"><button class="alt" onclick="exportStory()">导出当前旅行故事 HTML</button><p class="muted">导出故事文件前请检查照片与位置隐私。请勿将个人数据直接提交到公开 GitHub 仓库。</p></section></main><script>
const KEY='travelogue-local-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.trips))data={trips:[{id:'datong-2026',name:'北京—大同 · 两天一夜',start:'2026-11-14',end:'2026-11-15',records:[]}]};let active=data.trips[0]?.id;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('本地存储空间不足，请导出 JSON 备份并减少照片。')}}function trip(){return data.trips.find(t=>t.id===active)||data.trips[0]}function tab(id){['timeline','add','cost','map','backup'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='map')renderMap()}function selectTrip(id){active=id;render()}function newTrip(){const name=prompt('旅行名称（如：成都三日游）');if(!name?.trim())return;const start=prompt('开始日期 YYYY-MM-DD',new Date().toISOString().slice(0,10))||'';const end=prompt('结束日期 YYYY-MM-DD',start)||start;const t={id:Date.now().toString(36),name:name.trim(),start,end,records:[]};data.trips.push(t);active=t.id;save();render();tab('add')}function removeRecord(id){if(!confirm('确定删除这条记录？'))return;trip().records=trip().records.filter(x=>x.id!==id);save();render()}function render(){const t=trip();if(!t)return;$('tripTitle').textContent=t.name;$('tripDates').textContent=t.start+' — '+t.end;$('tripSelect').innerHTML=data.trips.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===active?'selected':'')+'>'+esc(x.name)+'</option>').join('');$('entries').innerHTML=t.records.length?t.records.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>'<div class="entry"><div class="row"><strong>'+esc(r.place)+'</strong><span class="chip">'+esc(r.type)+'</span></div><p class="muted">'+esc(r.time.replace('T',' '))+' · ¥'+Number(r.cost||0).toFixed(2)+'</p>'+(r.photo?'<img src="'+r.photo+'" alt="旅行照片">':'')+'<p>'+esc(r.note)+'</p><button class="alt" onclick="removeRecord(\''+esc(r.id)+'\')">删除</button></div>').join(''):'<p class="muted">还没有记录。点击「＋ 记录」，开始你的旅途。</p>';const groups={};let sum=0;t.records.forEach(r=>{const c=Number(r.cost)||0;sum+=c;groups[r.type]=(groups[r.type]||0)+c});$('stats').innerHTML='<h2>¥'+sum.toFixed(2)+'</h2><p class="muted">'+t.records.length+' 条记录</p>'+Object.entries(groups).map(([k,v])=>'<p>'+esc(k)+'：¥'+v.toFixed(2)+'</p>').join('');}function renderMap(){const list=trip().records.filter(r=>Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lng))&&r.lat!==''&&r.lng!=='');$('mapCanvas').innerHTML=list.length?list.map(r=>'<div class="entry"><strong>'+esc(r.place)+'</strong><p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+encodeURIComponent(r.lat)+'&mlon='+encodeURIComponent(r.lng)+'#map=15/'+encodeURIComponent(r.lat)+'/'+encodeURIComponent(r.lng)+'">查看地图定位</a></p></div>').join(''):'<p class="muted">记录地点时填写经纬度，即可在这里打开地图。</p>'}async function shrink(file){if(!file)return '';return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.68))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('照片读取失败'))};img.src=url})} $('recordForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r={id:Date.now().toString(36),place:f.get('place'),time:f.get('time'),type:f.get('type'),cost:Number(f.get('cost')||0),lat:f.get('lat'),lng:f.get('lng'),note:f.get('note'),photo:''};try{r.photo=await shrink($('photo').files[0]);trip().records.push(r);save();e.target.reset();render();tab('timeline')}catch(err){alert(err.message)}};function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportData(){download('travelogue-backup.json',JSON.stringify(data,null,2),'application/json')}async function importData(file){if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.trips)||!parsed.trips.every(t=>Array.isArray(t.records)))throw Error('无效的备份格式');if(!confirm('导入会替换当前全部旅行数据。请确认已经备份。'))return;data=parsed;active=data.trips[0]?.id;save();render();tab('timeline')}catch(e){alert('导入失败：'+e.message)}}function exportStory(){const t=trip();const items=t.records.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>'<article><h2>'+esc(r.place)+'</h2><small>'+esc(r.time)+' · '+esc(r.type)+' · ¥'+Number(r.cost||0).toFixed(2)+'</small>'+(r.photo?'<p><img src="'+r.photo+'" style="max-width:100%;border-radius:12px"></p>':'')+'<p>'+esc(r.note)+'</p></article>').join('');download('travelogue-story.html','<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+esc(t.name)+'</title><style>body{font:17px system-ui;background:#f6f5f0;color:#203a34;max-width:700px;margin:auto;padding:24px}article{background:white;border-radius:16px;padding:20px;margin:20px 0}small{color:#637a6c}</style><h1>'+esc(t.name)+'</h1><p>'+esc(t.start)+' — '+esc(t.end)+'</p>'+items+'</html>','text/html')}render();tab('timeline');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
